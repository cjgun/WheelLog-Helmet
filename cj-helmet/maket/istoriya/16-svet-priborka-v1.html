<style>
/* Прототип приложения в стиле Industrial: слева телефон (или Fold), справа пояснения. Экран всегда тёмный - так задумано приложение. */
:root{
  --pg:#e9e8e3; --pg-ink:#1d1d1b; --pg-mute:#67645d; --pg-line:#d3d0c7;
  --bg:#0b0e11; --card:#1a1f26; --card2:#232a33; --line:#2a313a; --ink:#e5e7eb; --mute:#8b939f;
  --or:#ff8a00; --yel:#ffc107; --grn:#22c55e; --red:#ef4444; --blu:#38bdf8;
  --f-num:"Exo 2",system-ui,sans-serif; --f-ui:"Onest",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pg:#101112;--pg-ink:#e9e8e3;--pg-mute:#9a968d;--pg-line:#2a2b2d;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#101112;--pg-ink:#e9e8e3;--pg-mute:#9a968d;--pg-line:#2a2b2d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--pg-ink);font:15px/1.5 var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.top{max-width:1180px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}
.top h1{font:800 clamp(24px,3.6vw,34px)/1.1 var(--f-num);margin:0;letter-spacing:.01em}
.top p{margin:0;color:var(--pg-mute);max-width:62ch}
.seg{display:inline-flex;background:color-mix(in srgb,var(--pg-ink) 8%,var(--pg));border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--pg-ink);font:600 14px var(--f-ui);padding:8px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pg-ink);color:var(--pg)}
.stage{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:12px;min-width:0}
.side h2{font:700 18px var(--f-num);margin:0}
.side p,.side li{color:var(--pg-mute)}
.side ul{margin:0;padding-left:18px;display:grid;gap:4px}
.side .src{font-size:13px}

/* устройство */
.dev{width:390px;max-width:100%;height:820px;background:var(--bg);color:var(--ink);border-radius:34px;border:1px solid #000;
  box-shadow:0 26px 60px -30px rgba(0,0,0,.7);overflow:hidden;position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;font-size:14px}
.dev.fold{width:min(1000px,100%);height:740px;border-radius:26px}
@media (max-width:440px){.dev{width:100%;height:calc(100svh - 40px);min-height:640px;border-radius:24px}}
.sbar{display:flex;justify-content:space-between;padding:10px 20px 4px;font:600 12px var(--f-num);color:var(--mute)}
.body{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.dev.fold .body{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr)}
.pane{overflow-y:auto;min-height:0;padding:4px 14px 90px;display:grid;gap:10px;align-content:start;scrollbar-width:thin}
.dev.fold .pane+.pane{border-left:1px solid var(--line)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:#0f1317;border-top:1px solid var(--line);padding:6px 6px 10px}
.nav button{border:0;background:none;color:var(--mute);font:600 11.5px var(--f-ui);display:grid;justify-items:center;gap:3px;padding:6px 0;cursor:pointer;min-height:48px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--or)}
.hd{display:flex;align-items:center;gap:10px;min-height:44px}
.hd .t{font:700 19px var(--f-num);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--card2);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.lbl{font:600 11px var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute);font-size:12.5px}
.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font:600 12px var(--f-ui);background:var(--card2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 7px var(--grn)}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 13.5px var(--f-ui);background:var(--card2);color:var(--ink);cursor:pointer;min-height:44px}
.btn.or{background:var(--or);color:#1a0d00}
.btn.red{background:#3b1414;color:#ff8a80}
.btn:focus-visible,.nav button:focus-visible,.ib:focus-visible,.tile:focus-visible,.chip:focus-visible,.li:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--ink);font:600 13px var(--f-ui);border-radius:999px;padding:8px 12px;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--or);border-color:var(--or);color:#1a0d00}
.li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;min-height:52px;color:var(--ink);text-align:left;font:inherit;width:100%}
.li .t{flex:1;min-width:0}
.li .v{color:var(--mute);font-size:13px}
.sw{width:42px;height:24px;border-radius:999px;background:#3a414c;position:relative;flex:none;border:0;cursor:pointer}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#9aa3ae;transition:left .15s}
.sw[aria-checked="true"]{background:var(--or)}.sw[aria-checked="true"]::after{left:21px;background:#1a0d00}
.rng{display:grid;gap:4px}
.rng input{width:100%;accent-color:var(--or)}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;display:grid;justify-items:center;gap:4px;cursor:pointer;color:var(--ink);font:inherit;min-height:86px;text-align:center}
.tile svg{width:24px;height:24px;color:var(--or)}
.tile b{font-size:12.5px;font-weight:600;line-height:1.2}
.tile span{font-size:11px;color:var(--mute);line-height:1.2}
.hero{background:radial-gradient(110% 90% at 50% 100%,#2a1a08 0%,#0b0e11 70%);border-radius:18px;padding:6px;display:grid;gap:4px}
.hero canvas{width:100%;height:auto;display:block;border-radius:14px}
.views{display:flex;gap:6px;justify-content:center}
.views button{border:0;background:var(--card2);color:var(--mute);font:600 11.5px var(--f-ui);border-radius:8px;padding:5px 9px;cursor:pointer}
.views button[aria-pressed="true"]{color:#1a0d00;background:var(--or)}
.save{position:absolute;left:12px;right:12px;bottom:84px;z-index:3;display:flex;gap:8px;align-items:center;background:var(--or);color:#1a0d00;border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 12px 30px -10px rgba(255,138,0,.6)}
.save b{font:700 14px var(--f-ui)}.save span{font-size:12px;opacity:.75;flex:1}
.save button{border:0;border-radius:10px;padding:9px 12px;font:700 13px var(--f-ui);cursor:pointer;background:#1a0d00;color:var(--or)}
.save button.ghost{background:transparent;color:#1a0d00;text-decoration:underline}
.dev.fold .save{left:auto;width:calc(52% - 24px);right:12px;bottom:84px}
.gauge{position:relative}
.gauge canvas{width:100%;display:block}
.gauge .c{position:absolute;inset:0;display:grid;place-items:center;align-content:center;padding-top:26px}
.gauge .v{font:800 76px/0.9 var(--f-num);letter-spacing:-.02em}
.gauge .u{font:600 13px var(--f-num);color:var(--mute)}
.gauge .p{font:700 17px var(--f-num);color:var(--yel);margin-top:4px}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 9px}
.blk .k{font-size:11px;color:var(--mute)}.blk .v{font:700 20px var(--f-num)}.blk .v small{font-size:12px;color:var(--mute);font-weight:600;margin-left:2px}
.bar{height:5px;border-radius:3px;background:#2a313a;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--grn)}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center}
.big button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}

.big button.rec{border-color:#7a1d1d;box-shadow:inset 0 0 0 6px #2a0f0f}

.tbl{display:grid;grid-template-columns:1fr auto;gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl div{padding:8px 12px;border-bottom:1px solid var(--line)}
.tbl div:nth-child(even){text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tape{display:flex;height:34px;gap:2px;border-radius:10px;overflow:hidden}
.tape button{border:0;font:700 11px var(--f-num);color:#0b0e11;cursor:pointer;min-width:0;padding:0}
.tape button[aria-pressed="true"]{outline:3px solid #fff;outline-offset:-3px}
.step{display:flex;gap:4px;align-items:center}
.step button{border:0;border-radius:8px;background:#2a313a;color:var(--ink);font:700 12px var(--f-num);min-width:36px;height:34px;cursor:pointer}
.step b{min-width:36px;text-align:center;font:700 17px var(--f-num)}
.cbtn{display:flex;align-items:center;gap:10px;background:var(--card2);border:0;border-radius:12px;padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer;text-align:left;min-height:48px;width:100%}
.cbtn i{width:30px;height:30px;border-radius:9px;flex:none}
.cbtn i.none{background:repeating-linear-gradient(45deg,#2a313a 0 5px,#1a1f26 5px 10px)}
.mode{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:9px;cursor:pointer;color:var(--ink);font:inherit;text-align:left;width:100%}
.mode[aria-pressed="true"]{border-color:var(--or)}
.mode canvas{width:72px;height:18px;border-radius:6px;background:#07090b}
.thr{position:relative;height:30px}
.thr .b{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--grn),var(--yel) 60%,var(--red))}
.thr .m{position:absolute;top:4px;width:2px;height:22px;background:#fff}
.thr .m span{position:absolute;top:-16px;left:-12px;font:600 10px var(--f-num);color:var(--mute);width:30px;text-align:center}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 14px 20px;display:grid;gap:10px;box-shadow:0 -20px 40px rgba(0,0,0,.5)}
.dev.fold .sheet{left:auto;width:52%}
.scrim{position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.5)}
.grab{width:40px;height:4px;border-radius:2px;background:#3a414c;justify-self:center}
.sv{position:relative;height:180px;border-radius:14px;cursor:crosshair;touch-action:none}
.sv i{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000;transform:translate(-50%,-50%);pointer-events:none}
.hue{position:relative;height:18px;border-radius:9px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer;touch-action:none}
.hue i{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 1px #000}
.rec{display:flex;gap:8px}
.rec button{width:34px;height:34px;border-radius:50%;border:1.5px solid #3a414c;cursor:pointer}
.map{position:relative;border-radius:14px;overflow:hidden;background:#11161b}
.map canvas{display:block;width:100%}
.map span{position:absolute;left:8px;bottom:6px;font-size:10.5px;color:var(--mute)}
.chart canvas{display:block;width:100%;height:150px}
.wheelpic{display:block;width:100%;height:auto}
.det summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px}
.det summary::-webkit-details-marker{display:none}
.det summary::after{content:"›";margin-left:auto;color:var(--mute);font-size:18px;transition:transform .15s}
.det[open] summary::after{transform:rotate(90deg)}
.danger{border-color:#5a1d1d}
.scan{display:grid;place-items:center;height:200px;position:relative}
.scan i{position:absolute;border:2px solid var(--or);border-radius:50%;opacity:.6;animation:ping 2.4s infinite}
@keyframes ping{from{width:40px;height:40px;opacity:.8}to{width:220px;height:220px;opacity:0}}
@media (prefers-reduced-motion:reduce){.scan i{animation:none}}

/* стиль «приборки» - как главный экран */
:root{--bg:#0b0d10;--card:transparent;--card2:rgba(255,255,255,.04);--line:rgba(255,255,255,.07);--ink:#eef0f2;--mute:#7d848e;--or:#ff9a2e;--f-num:"Manrope",system-ui,sans-serif;--f-ui:"Manrope",system-ui,sans-serif}
.dev{background:radial-gradient(120% 60% at 50% 20%,#161a20 0%,#0d1014 45%,#07080a 100%);border-radius:38px;box-shadow:0 0 0 1px #000,0 0 0 9px #16181b,0 0 0 10px #2a2d31,0 30px 60px -30px rgba(0,0,0,.8)}
.nav{background:transparent;border-top:1px solid var(--line)}

.ib{background:transparent;border:1px solid var(--line);color:var(--mute)}

.card{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0}
.chip{background:transparent;border:1px solid var(--line);color:#c9ced5;font:600 12.5px var(--f-ui);border-radius:999px}

.nowv{font:300 30px/1.1 var(--f-ui);letter-spacing:-.01em}
.dlist{display:grid}

<div class="top">
  <div style="display:grid;gap:6px;flex:1;min-width:260px">
    <h1>Экран «Свет»</h1>
    <p>В стиле нового главного экрана. Нажимай: устройство, вид шлема, разделы, цвета, «Стоп». Правки помечаются, внизу появляется «Записать». Это макет: платы здесь не подключаются.</p>
  </div>
  <div class="seg" role="group" aria-label="Устройство"><button id="vPhone" aria-pressed="true">Телефон S24</button><button id="vFold" aria-pressed="false">Fold разложен</button></div>
</div>

function along(p){const L=[0];for(let i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));return L;}
const PTS={};for(const k in TAPE){PTS[k]=[];TAPE[k].forEach((seg,si)=>{const L=along(seg),tot=L[L.length-1],n=Math.max(8,Math.round(tot/9)),[ua,ub]=U[k][si];
  for(let j=0;j<n;j++){const dd=tot*j/(n-1);let i=1;while(i<L.length-1&&L[i]<dd)i++;const tt=(dd-L[i-1])/(L[i]-L[i-1]||1);
  PTS[k].push([seg[i-1][0]+(seg[i][0]-seg[i-1][0])*tt,seg[i-1][1]+(seg[i][1]-seg[i-1][1])*tt,ua+(ub-ua)*j/(n-1)]);}});}
const imgs={};for(const k in IMG){const im=new Image();im.src=IMG[k];imgs[k]=im;}
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
const mix=(a,b,k)=>a.map((x,i)=>x+(b[i]-x)*k), frac=x=>x-Math.floor(x);
function hsvRgb(h,s,v){h=frac(h)*6;const i=Math.floor(h),f=h-i,p=v*(1-s),q=v*(1-s*f),t=v*(1-s*(1-f));return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6];}
function hashf(n){n=Math.sin(n*127.1)*43758.5453;return frac(n);}
let phase=0,lastT=performance.now(),testStop=0;
function segColorAt(d,u){ // обычный режим: по роли или свой цвет сегмента
  const c=d.cfg, side=u<0.5?'R':'L', dd=u<=0.5?u*2:(1-u)*2;
  // находим сегмент по месту на кольце (как прошивка: по кругу пропорционально точкам)
  const ring=['Перед справа','Бок справа','Зад','Бок слева','Перед слева'];let tot=0;c.segs.forEach(s=>{if(ring.includes(s.r))tot+=s.n;});
  let k=0,uu=u<0.5?u:u;let found=null;for(const r of ring)for(const s of c.segs){if(s.r!==r)continue;const a=k/tot,b=(k+s.n)/tot;if(uu>=a&&uu<=b)found=s;k+=s.n;}
  if(found&&found.color==='#000000')return [0,0,0];
  if(found&&found.color)return hex(found.color).map(x=>x*0.8);
  if(dd<0.12&&c.frontWhite)return [0.8,0.82,0.86];
  return [0.55,0,0];
}
function fxColor(d,u,id,t,v){
  const c=d.cfg,dd=u<=0.5?u*2:(1-u)*2;
  if(S.testTurn&&((S.testTurn===1&&u>=0.5)||(S.testTurn===2&&u<0.5))){const ph=(t%0.8)/0.5;return ph<1&&dd<ph+0.1?[1,0.55,0]:[0.06,0.02,0];}
  if(testStop){const e=t-testStop;const lit=stopLit(c.stopMode,e,c.stopHz);const z=c.stopZone===0?dd>0.3:c.stopZone===1?dd>0.62:dd>0.86;if(z)return lit?[1,0,0]:[0.13,0,0];}
  if(c.fx===0)return segColorAt(d,u);
  if(c.frontWhite&&dd<0.1)return [0.8,0.82,0.86];
  if(c.backRed&&dd>0.86)return [0.45,0,0];
  const c1=hex(c.c1),c2=hex(c.c2),k=c.fxBright/200;let r;
  switch(c.fx){
    case 1:case 6:case 13:{if(c.fx===6&&v<3){const b=0.25+0.75*(0.5-0.5*Math.cos(t*2*Math.PI/4));r=c1.map(x=>x*b);break;}
      let best=0,bx=0;for(let q=0;q<3;q++){let x=frac(phase+q/3)-dd;if(x<0)x+=1;const b=Math.exp(-x*9);if(b>best){best=b;bx=x;}}r=mix(c2,c1,Math.exp(-bx*6)).map(x=>x*Math.max(0.04,best));break;}
    case 2:r=mix(c1,c2,0.5+0.5*Math.sin(2*Math.PI*(dd*2-phase*2)));break;
    case 3:{const f=v/60;r=dd>f?c1.map(x=>x*0.05):mix(c1,c2,dd);break;}
    case 4:{const rate=1+v/4,slot=Math.floor(t*rate+hashf(id)*7),on=hashf(id*3.1+slot)<0.12+v/250,age=frac(t*rate+hashf(id)*7);r=on?mix(c2,c1,age).map(x=>x*(1-age*0.7)):c1.map(x=>x*0.12);break;}
    case 5:r=hsvRgb(dd*1.2-phase,1,0.9);break;
    case 7:{const p=0.5-0.5*Math.cos(phase*Math.PI*1.2),x=Math.abs(dd-p);r=mix(c2,c1,Math.min(1,x*6)).map(z=>z*Math.max(0.04,Math.exp(-x*14)));break;}
    case 8:r=frac(dd*5-phase*2.5)<0.45?c1:c1.map(z=>z*0.06);break;
    case 9:{const fl=hashf(id+Math.floor(t*14))*0.5+hashf(id*1.7+Math.floor(t*9))*0.5,reach=0.25+Math.min(0.75,v/50),kk=Math.max(0,1-(1-dd)/reach),h=kk*(0.55+0.45*fl);r=mix([0.05,0,0],mix(c1,c2,1-h),Math.min(1,h*1.4)).map(z=>z*Math.min(1,0.15+h*1.2));break;}
    case 10:{let b=0;for(let m=0;m<5;m++){const sp=0.6+hashf(m*9.3)*0.9,len=0.08+hashf(m*3.7)*0.2,x=frac(phase*sp+hashf(m*5.1))-dd;if(x>=0&&x<len)b=Math.max(b,1-x/len);}r=mix(c1,c2,b).map(z=>z*Math.max(0.03,b));break;}
    case 11:{const w=0.5+0.5*Math.sin(2*Math.PI*(dd*1.3+t*0.07+phase*0.2))*Math.sin(2*Math.PI*(dd*0.7-t*0.05));r=mix(c1,c2,w).map(z=>z*(0.45+0.55*w));break;}
    case 12:r=dd<0.4?c2.map(z=>z*0.8):c1.map(z=>z*0.35);break;
    default:r=c1;
  }
  return r.map(x=>x*Math.min(1.3,k));
}
function stopLit(m,e,hz){const on=x=>frac(x)<0.5;switch(m){case 0:return true;case 1:return on(e*hz);case 2:return e<4/hz?on(e*hz):true;case 3:return e<1.2?true:on(e*hz);case 4:{const p=1/hz,c=e%(p*3+0.45);return c<p*3?on(c*hz):false;}}return true;}

function scrSettings(){return hd('Настройки')+[['Тема','как в телефоне'],['Язык','русский'],['Единицы','км/ч, °C'],['Главный экран','страницы, блоки, картинка в картинке'],['Звук','подключение, потеря связи'],['Подключение','автопереподключение'],['Гудок','по нажатию, кнопки громкости'],['Система','оптимизация батареи'],['О приложении','WheelLog Шлем shlem9']].map(r=>`<button class="li"><span class="t"><b style="font-weight:600">${r[0]}</b><br><span class="mute">${r[1]}</span></span><span class="v">›</span></button>`).join('');}
function scrScan(){return hd('Поиск колеса')+`<div class="scan"><i></i><i style="animation-delay:.8s"></i><i style="animation-delay:1.6s"></i><span style="color:var(--or)">${IC.bt}</span></div><button class="li"><span class="t"><b style="font-weight:600">LK13378 · Sherman L</b><br><span class="mute n">-68 дБм · последнее колесо</span></span><span class="pill" style="color:var(--or)">подключить</span></button><button class="li"><span class="t"><b style="font-weight:600">CJ-SmeL</b><br><span class="mute">плата колеса - это не колесо</span></span></button><button class="btn">Остановить поиск</button>`;}

const SCR={ride:scrRide,light:scrLight,dev:scrDev,fx:scrFx,tape:scrTape,stop:scrStop,bright:scrBright,rim:scrRim,conn:scrConn,board:scrBoard,trips:scrTrips,trip:scrTrip,logset:scrLogset,wheel:scrWheel,alarms:scrAlarms,settings:scrSettings,scan:scrScan};
const TABS=[['ride','Езда',IC.ride],['light','Свет',IC.light],['trips','Поездки',IC.trips],['wheel','Колесо',IC.wheel]];
const NOTES={
 ride:['Езда','Главный экран. Сверху вкладки: Приборы, Все параметры, График, События (в WheelLog это листалка). Шестерёнка - настройки приложения. Внизу три большие кнопки под перчатку: запись, гудок, поиск колеса.'],
 light:['Свет','Сверху общий выключатель и что сейчас. Ниже устройства: живая картинка, что включено, связь и свой выключатель света у каждого. Нажатие на устройство - его настройки. Внизу проверка на всех сразу.'],
 dev:['Шлем или колесо','Живая картинка сверху, быстрая проверка (Стоп повторяет вспышки), плитки разделов с текущим значением. У колеса нет «Эффекта», зато есть «Обод».'],
 fx:['Эффект','15 эффектов прошивки. Цвета - кнопками, по нажатию окно цвета. Правка сразу бежит на картинке и показывает плашку «Записать».'],
 tape:['Лента и цвета','Полоса из сегментов. Нажал сегмент - его цвет, точки, роль, направление. Свои шаблоны. У сегмента «Убрать цвет» = цвет по роли, чёрный = не горит.'],
 stop:['Стоп и сигналы','Варианты стопа с мини-анимацией. Пороги стопа и повороты свёрнуты. Нажми «Стоп» на экране шлема - увидишь выбранный вариант.'],
 bright:['Яркость и ток','Габарит, стоп, предел тока. У колеса - цвет педалей.'],rim:['Обод','Только у колеса: подсветка мотора.'],
 conn:['Связь','Оборудование и связь шлема с колесом по ESP-NOW. У колеса - состояние провода.'],board:['Плата','Обновление по Bluetooth главное, Wi-Fi свёрнут как запасной.'],
 trips:['Поездки','Список с мини-треком. Шестерёнка - настройки записи.'],trip:['Поездка','Трек (цвет - скорость) и график. В приложении под треком карта.'],
 logset:['Запись поездок','Только настоящие пункты WheelLog.'],wheel:['Колесо','Шапка колеса, предупреждения отдельным экраном, общие и Veteran, служебное, опасное отдельно красным.'],
 alarms:['Предупреждения','Два режима: по PWM (наглядная шкала) или по скорости (три порога). Ток, температура и разряд - отдельные пороги.'],
 settings:['Настройки приложения','Шестерёнка на Езде и Колесе.'],scan:['Поиск колеса','Последнее колесо сверху одной кнопкой.']};

function cur(){return S.stack.length?S.stack[S.stack.length-1]:S.tab;}
function render(){
  const c=cur(),d=dev();
  const body=$('#body');const scroll=body.querySelector('.pane:last-child')?.scrollTop||0;
  let left='',right='';
  if(S.fold){left=`<div class="pane">${scrRide()}</div>`;right=`<div class="pane">${(c==='ride'?scrLight():SCR[c]())}</div>`;}
  else right=`<div class="pane">${SCR[c]()}</div>`;
  body.innerHTML=left+right;
  const devScreens=['dev','fx','tape','stop','bright','rim','conn','board'];
  if(devScreens.includes(c)&&dirty(d)){const what=whatChanged(d);body.insertAdjacentHTML('beforeend',`<div class="save" role="status"><b>Записать в ${d.kind==='wheel'?'колесо':'шлем'}</b><span>${what}</span><button class="ghost" data-undo>Отменить</button><button data-write>Записать</button></div>`);}
  if(S.sheet)body.insertAdjacentHTML('beforeend',`<div class="scrim" data-close></div>${sheetHtml()}`);
  $('#nav').innerHTML=TABS.map(t=>`<button aria-current="${S.tab===t[0]?'page':'false'}" data-tab="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join('');
  const n=NOTES[c]||NOTES.ride;$('#side').innerHTML=`<h2>${n[0]}</h2><p>${n[1]}</p><ul><li>Нижние вкладки: Езда, Свет, Поездки, Колесо.</li><li>«Записать» появляется только при правках и пишет, что изменено.</li><li>Окно цвета одно: свой цвет, недавние, «Убрать цвет».</li><li>Fold разложен: слева приборы, справа раздел.</li></ul><p class="src">Шлемы - по фото СиДжея, точки - по ленте. Колесо - схема, Шмель по фото добавлю при сборке.</p>`;
  if(scroll&&!S._reset)body.querySelector('.pane:last-child').scrollTop=scroll;S._reset=false;
  drawStatic();
}
function whatChanged(d){const a=JSON.parse(d.saved),b=d.cfg,out=[];
  if(a.fx!==b.fx)out.push('эффект: '+FX[b.fx][0]);if(a.c1!==b.c1||a.c2!==b.c2)out.push('цвета');if(a.stopMode!==b.stopMode)out.push('стоп: '+STOPM[b.stopMode][0].toLowerCase());
  if(JSON.stringify(a.segs)!==JSON.stringify(b.segs))out.push('сегменты');if(!out.length)out.push('настройки');return out.join(', ');}

// окно цвета
function sheetHtml(){const col=S.sheet.col||'#ff8a00';const [h,s,v]=rgbHsv(col);
  return `<div class="sheet" role="dialog" aria-label="Выбор цвета"><div class="grab"></div><div class="row"><b style="font-size:16px">${S.sheet.title}</b><span class="sp"></span><span class="pill n" style="background:${col};color:${v>0.6&&s<0.5?'#000':'#fff'}">${col.toUpperCase()}</span></div>
  <div class="sv" id="sv" style="background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hsvHex(h,1,1)})"><i style="left:${s*100}%;top:${(1-v)*100}%;background:${col}"></i></div>
  <div class="hue" id="hue"><i style="left:${h*100}%;background:${hsvHex(h,1,1)}"></i></div>
  <div class="lbl">Недавние</div><div class="rec">${S.recent.map(c=>`<button style="background:${c}" data-recent="${c}" aria-label="${c}"></button>`).join('')}</div>
  <div class="row"><button class="btn" data-nocolor>Убрать цвет</button><span class="sp"></span><button class="btn or" data-done>Готово</button></div></div>`;}
function rgbHsv(hx){const [r,g,b]=hex(hx),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1;}return [h,mx?d/mx:0,mx];}
function hsvHex(h,s,v){return '#'+hsvRgb(h,s,v).map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');}
function setColor(col){const d=dev(),k=S.sheet.key;
  if(k==='seg')d.cfg.segs[S.seg].color=col;else if(k==='c1'||k==='c2'||k==='pedal'||k==='accelC')d.cfg[k]=col||({c1:'#00c8ff',c2:'#7a00ff',pedal:'#ff8a00',accelC:'#00c8a0'})[k];
  S.sheet.col=col||S.sheet.col;}

// ---------- события ----------
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-close]');if(!b||!$('#dev').contains(b))return;const d=dev(),c=d.cfg,ds=b.dataset;
  if(ds.tab){S.tab=ds.tab;S.stack=[];S.sheet=null;S._reset=true;}
  else if('back' in ds){S.stack.pop();S._reset=true;}
  else if(ds.go){S.stack.push(ds.go);S._reset=true;}
  else if(ds.dev){S.dev=ds.dev;S.seg=0;S.view='side';S.stack=[];if(S.tab!=='light')S.tab='light';S.stack.push('dev');S._reset=true;}
  else if(ds.view){S.view=ds.view;}
  else if(ds.devon){const x=DEVS.find(q=>q.id===ds.devon);x.on=x.on===false;}
  else if(ds.ridepage){S.ridePage=+ds.ridepage;}
  else if('rec' in ds){S.rec=!S.rec;}
  else if(ds.fx){const i=+ds.fx;c.fx=i;if(i===9){c.c1='#ff2a00';c.c2='#ffc400';}if(i===11){c.c1='#00ff9c';c.c2='#7a00ff';}}
  else if(ds.stopm){c.stopMode=+ds.stopm;testStop=performance.now()/1000;}
  else if(ds.zone){c.stopZone=+ds.zone;testStop=performance.now()/1000;}
  else if(ds.seg){S.seg=+ds.seg;}
  else if(ds.cnt){c.segs[S.seg].n=Math.max(1,Math.min(300,c.segs[S.seg].n+ +ds.cnt));}
  else if('segup' in ds){if(S.seg>0){[c.segs[S.seg-1],c.segs[S.seg]]=[c.segs[S.seg],c.segs[S.seg-1]];S.seg--;}}
  else if('segdel' in ds){if(c.segs.length>1){c.segs.splice(S.seg,1);S.seg=Math.max(0,S.seg-1);}}
  else if('segadd' in ds){if(c.segs.length<8){c.segs.push({n:10,r:d.kind==='wheel'?'Габарит справа':'Стоп-полоса'});S.seg=c.segs.length-1;}}
  else if('tplsave' in ds){TPL.push({name:'Мой шаблон '+(TPL.filter(t=>t.own).length+1),kind:d.kind,own:true});}
  else if(ds.sw){const k=ds.sw;if(k==='rev')c.segs[S.seg].rev=!c.segs[S.seg].rev;else if(k in c)c[k]=!c[k];else{S['sw_'+k]=!(b.getAttribute('aria-checked')==='true');b.setAttribute('aria-checked',S['sw_'+k]);return;}}
  else if(ds.color){const titles={c1:'Цвет 1 эффекта',c2:'Цвет 2 эффекта',seg:'Цвет сегмента '+(S.seg+1),pedal:'Цвет педалей',accelC:'Цвет разгона'};const curc=ds.color==='seg'?c.segs[S.seg].color:c[ds.color];S.sheet={key:ds.color,title:titles[ds.color],col:curc||'#ff8a00'};}
  else if('close' in ds||'done' in ds){if(S.sheet&&S.sheet.col&&!S.recent.includes(S.sheet.col)){S.recent.unshift(S.sheet.col);S.recent=S.recent.slice(0,8);}S.sheet=null;}
  else if(ds.recent){setColor(ds.recent);}
  else if('nocolor' in ds){if(S.sheet.key==='seg')c.segs[S.seg].color=undefined;else setColor(null);S.sheet=null;}
  else if('write' in ds){d.saved=JSON.stringify(c);}
  else if('undo' in ds){d.cfg=JSON.parse(d.saved);}
  else if(ds.test){if(ds.test==='Стоп'){testStop=performance.now()/1000;S.testTurn=0;}else if(ds.test.includes('←')){S.testTurn=S.testTurn===1?0:1;testStop=0;}else if(ds.test.includes('→')){S.testTurn=S.testTurn===2?0:2;testStop=0;}else{testStop=0;S.testTurn=0;}return;}
  else if(ds.trip){S.trip=+ds.trip;S.stack.push('trip');S._reset=true;}
  else if(ds.al){S.alSpeed=ds.al==='1';}
  else if('horn' in ds){return;}
  else return;
  render();});
document.addEventListener('input',e=>{const t=e.target;if(!$('#dev').contains(t))return;const d=dev(),c=d.cfg;
  if(t.dataset.rng){const k=t.dataset.rng,v=+t.value;if(k in c)c[k]=v;const o=$('#body').querySelector(`[data-out="${k}"]`);if(o)o.textContent=v+(t.dataset.unit||'');updSave();}
  else if('role' in t.dataset){c.segs[S.seg].r=t.value;render();}
  else if('strip' in t.dataset){c.strip=+t.value;updSave();}});
function updSave(){const d=dev(),has=!!$('#body .save');if(dirty(d)!==has)render();else if(has)$('#body .save span').textContent=whatChanged(d);}
// перетаскивание в окне цвета
function drag(el,fn){el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);fn(e);const mv=ev=>fn(ev);el.addEventListener('pointermove',mv);el.addEventListener('pointerup',()=>{el.removeEventListener('pointermove',mv);render();},{once:true});});}
new MutationObserver(()=>{const sv=$('#sv'),hu=$('#hue');if(sv&&!sv._b){sv._b=1;drag(sv,e=>{const r=sv.getBoundingClientRect(),s=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),v=1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));const [h]=rgbHsv(S.sheet.col);S.sheet.h=S.sheet.h??h;const col=hsvHex(S.sheet.h,s,v);setColor(col);const i=sv.querySelector('i');i.style.left=s*100+'%';i.style.top=(1-v)*100+'%';i.style.background=col;});}
  if(hu&&!hu._b){hu._b=1;drag(hu,e=>{const r=hu.getBoundingClientRect(),h=Math.max(0,Math.min(0.999,(e.clientX-r.left)/r.width));const [,s,v]=rgbHsv(S.sheet.col);S.sheet.h=h;const col=hsvHex(h,s||1,v||1);setColor(col);hu.querySelector('i').style.left=h*100+'%';$('#sv').style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hsvHex(h,1,1)})`;});}}).observe(document.body,{childList:true,subtree:true});
$('#vPhone').onclick=()=>{S.fold=false;$('#dev').classList.remove('fold');$('#vPhone').setAttribute('aria-pressed','true');$('#vFold').setAttribute('aria-pressed','false');render();};
$('#vFold').onclick=()=>{S.fold=true;$('#dev').classList.add('fold');$('#vFold').setAttribute('aria-pressed','true');$('#vPhone').setAttribute('aria-pressed','false');render();};

// ---------- рисование ----------
function drawTrack(cv,t,thick){const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.fillStyle='#11161b';g.fillRect(0,0,W,H);
  if(!t.track.length){g.fillStyle='#5b6470';g.font=(thick?'600 22px':'600 13px')+' Onest';g.textAlign='center';g.fillText(thick?'GPS в этой поездке не записан':'нет GPS',W/2,H/2+5);g.textAlign='left';return;}
  if(thick){g.strokeStyle='#1b222a';g.lineWidth=1;for(let x=0;x<W;x+=35){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}for(let y=0;y<H;y+=35){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}}
  const xs=t.track.map(q=>q[0]),ys=t.track.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const pad=thick?36:6,k=Math.min((W-2*pad)/((x1-x0)||1),(H-2*pad)/((y1-y0)||1)),ox=(W-(x1-x0)*k)/2,oy=(H-(y1-y0)*k)/2;
  const sx=x=>ox+(x-x0)*k,sy=y=>oy+(y-y0)*k;
  g.lineWidth=thick?5:2;g.lineCap='round';for(let i=1;i<t.track.length;i++){const a=t.track[i-1],b=t.track[i],f=Math.min(1,b[2]/45);g.strokeStyle=`rgb(${Math.round(255)},${Math.round(200-120*f)},${Math.round(40*(1-f))})`;g.beginPath();g.moveTo(sx(a[0]),sy(a[1]));g.lineTo(sx(b[0]),sy(b[1]));g.stroke();}
  if(thick){const s=t.track[0],e=t.track[t.track.length-1];g.fillStyle='#22c55e';g.beginPath();g.arc(sx(s[0]),sy(s[1]),7,0,7);g.fill();g.fillStyle='#ef4444';g.beginPath();g.arc(sx(e[0]),sy(e[1]),7,0,7);g.fill();}}
function drawChart(cv,series,cols){const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.clearRect(0,0,W,H);g.strokeStyle='#232a33';g.lineWidth=1;for(let y=0;y<=4;y++){g.beginPath();g.moveTo(0,10+y*(H-20)/4);g.lineTo(W,10+y*(H-20)/4);g.stroke();}
  cols.forEach(([idx,col,max])=>{g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();series.forEach((p,i)=>{const x=i*W/(series.length-1),y=H-10-(Math.min(max,Math.abs(p[idx]))/max)*(H-20);i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();});}
function drawStatic(){const t=TRIPS[S.trip];document.querySelectorAll('canvas[data-mini]').forEach(cv=>drawTrack(cv,TRIPS[+cv.dataset.mini],false));
  const m=$('#mapCv');if(m)drawTrack(m,t,true);const ch=$('#tripChart');if(ch)drawChart(ch,t.series,[[0,'#ff8a00',60],[1,'#ffc107',100]]);
  const lc=$('#liveChart');if(lc)drawChart(lc,TRIPS[0].series,[[0,'#ff8a00',60],[3,'#38bdf8',40]]);}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){const t=now/1000,dt=Math.min(0.1,(now-lastT)/1000);lastT=now;if(!reduce)phase+=dt*(0.12+15/25)*(dev().cfg.fxSpeed/100);
  if(testStop&&t-testStop>3.5)testStop=0;
  const hc=$('#heroCv');if(hc)drawHelmet(hc,dev(),t,15);
  const wc=$('#wheelCv');if(wc)drawWheel(wc,dev(),t);
  document.querySelectorAll('canvas[data-wthumb]').forEach(cv=>drawWheel(cv,DEVS.find(x=>x.id===cv.dataset.wthumb),t));
  document.querySelectorAll('canvas[data-thumb]').forEach(cv=>{const d=DEVS.find(x=>x.id===cv.dataset.thumb),k=d.img+'-side',im=imgs[k];if(!im.complete)return;const g=cv.getContext('2d');cv.width=im.naturalWidth;cv.height=im.naturalHeight;const sv=S.view;S.view='side';drawHelmet(cv,d,t,15);S.view=sv;});
  document.querySelectorAll('canvas[data-m]').forEach(cv=>{const g=cv.getContext('2d'),m=+cv.dataset.m,e=(t%3.4),lit=e<2.6?stopLit(m,e,dev().cfg.stopHz):false;g.fillStyle='#07090b';g.fillRect(0,0,cv.width,cv.height);for(let i=0;i<12;i++){g.fillStyle=lit?'#ff2a20':'#3a0806';g.beginPath();g.arc(8+i*11.5,18,4,0,7);g.fill();}});
  const gc=$('#gauge');if(gc&&!gc._d){gc._d=1;drawGauge(gc,32);}
  requestAnimationFrame(frame);}
render();requestAnimationFrame(frame);
</script>

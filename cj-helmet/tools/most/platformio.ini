; Мост USB <-> UART для чтения Bluetooth-модуля колеса (HM-10, ZS-040) AT-запросами.
; Плата nanoESP32-C6: GPIO20 <- TXD модуля, GPIO19 -> RXD модуля, 5V -> VCC, GND -> GND.
[env:most-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Классический ESP32 (плата с Ethernet, USB через CH343): GPIO33 <- TXD модуля, GPIO32 -> RXD модуля
[env:most-esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DMOST_RX=33 -DMOST_TX=32

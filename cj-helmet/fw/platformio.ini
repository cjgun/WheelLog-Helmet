; Прошивка шлема CJ-Helmet. Сборка на MiniGUN: /opt/helmet/sobrat.sh
[platformio]
default_envs = nano-c6

[env:nano-c6]
; pioarduino: Arduino-ядро 3.x, в официальной платформе C6 нет
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
  adafruit/Adafruit NeoPixel@1.15.5

; Обновление по Wi-Fi: /opt/helmet/obnovit.sh (пароль из /opt/helmet/sekrety.txt, не здесь)
[env:nano-c6-ota]
extends = env:nano-c6
upload_protocol = espota

; Плата колеса (и шлема LS2): ESP32-C3 Super Mini, 4 МБ - два раздела по 1.9 МБ под обновление по воздуху
[env:c3-mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
build_flags =
  -DBOARD_C3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
  adafruit/Adafruit NeoPixel@1.15.5

[env:c3-mini-ota]
extends = env:c3-mini
upload_protocol = espota
